    working_dir: /colcon_ws/src/yolov5
    environment:
      - SERVICE_NAME=yolov5
      - PYTHONPATH=/colcon_ws/src:$PYTHONPATH
      - YOLOV5_MODELS_DIR=/colcon_ws/src/yolov5/models
      - YOLOV5_LIB_DIR=/colcon_ws/src/yolov5/yolov5_lib

  ground_station:
