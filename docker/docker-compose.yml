  carla:
        image: stargaze0909/carla_uli_ubuntu20:latest
        logging:
          options:
            max-size: "10m"
            max-file: "3"
        privileged: true
        environment:
            SDL_VIDEODRIVER: x11
            DISPLAY: $DISPLAY
        ports:
            - "2000:2000"
            - "2001:2001"
            - "2002:2002"
        command: ./CarlaUE4.sh #-quality-level=Low -carla-rpc-port=2000
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - /etc/localtime:/etc/localtime
            - /etc/timezone:/etc/timezone
            - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d
        deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  count: "all"
                  capabilities: [compute,utility,graphics,display]

  env_sim:
    container_name: env_sim
    build:
      context: ../env_sim
      dockerfile: Dockerfile
    environment:
      - DISPLAY=${DISPLAY}
      - SERVICE_NAME=env_sim
    volumes:
        - /tmp/.X11-unix:/tmp/.X11-unix:rw
        - ../env_sim:/catkin_ws/src/env_sim
        - ../utils:/catkin_ws/src/env_sim/rraaa/script/utils
        - ../records:/catkin_ws/src/env_sim/rraaa/script/records
    privileged: true
    network_mode: host
    devices:
      - "/dev/snd"
    tty: true
    stdin_open: true
    # depends_on:
    #   - roscore
    working_dir: /catkin_ws/src/env_sim

  sim_control:
    container_name: sim_control
    build:
      context: ../sim_control
      dockerfile: Dockerfile
    volumes:
        - ../sim_control:/colcon_ws/src/sim_control
        - ../utils:/colcon_ws/src/utils
    privileged: true
    network_mode: host
    tty: true
    stdin_open: true
    # depends_on:
    #   - roscore
    working_dir: /colcon_ws
    environment:
      - SERVICE_NAME=sim_control
      - PYTHONPATH=/colcon_ws/src:$PYTHONPATH

  jaxguam:
